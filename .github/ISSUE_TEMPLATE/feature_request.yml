name: Feature request
description: Propose a focused improvement or integration
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Engine
        - Built-in tool
        - Framework integration
        - Performance
        - Documentation
        - Packaging / tooling
    validations:
      required: true

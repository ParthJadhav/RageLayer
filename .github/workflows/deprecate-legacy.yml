name: Deprecate legacy npm packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js for npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Deprecate previous package names
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate "ragekit@*" "Renamed to ragelayer. Install ragelayer instead."
          npm deprecate "desktop-destroyer@*" "Renamed to ragelayer. Install ragelayer instead."

name: Tool demo

# On demand only. This records what every tool does; it does not decide whether
# the result is right — a person watches the reel and makes that call. It is not
# a required check and nothing blocks on it.
#
# Two ways to ask for one:
#   * Actions → Tool demo → Run workflow, and pick a branch.
#   * Add the `tool-demo` label to a pull request.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Record a single tool (e.g. laser-cutter). Blank records all 16."
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: tool-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record tool reel
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'tool-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      # ffmpeg stitches the screencast frames into clips. Preinstalled on the
      # GitHub runner image; installed here so a slimmer image still records.
      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build
        run: bun run build

      - name: Record every tool
        env:
          RAGELAYER_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tool-demo.mjs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      # Always uploaded: a run that ends on a console error is exactly when the
      # clips recorded up to that point are worth watching.
      - name: Upload reel and stills
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-demo
          path: artifacts/tool-demo
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Tool demo"
            echo
            echo "Download the **tool-demo** artifact below and watch \`all-tools.mp4\`,"
            echo "or open \`index.html\` for per-tool clips with their measured context."
            echo
            if [ -f artifacts/tool-demo/README.md ]; then
              sed -n '/^| Tool/,/^$/p' artifacts/tool-demo/README.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

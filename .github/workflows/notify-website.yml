# Tells the portfolio website (ParthJadhav/me) that a new RageLayer version
# shipped, so its "Sync RageLayer docs" workflow regenerates the docs pages
# from this repo's docs/ at the released tag and opens a review PR.
#
# Setup (one-time): create a fine-grained personal access token that can see
# ONLY the ParthJadhav/me repository, with the single permission
# "Contents: read and write" (repository_dispatch requires it), and store it
# in this repo as the Actions secret WEBSITE_DISPATCH_TOKEN. Nothing else —
# no org scope, no workflow scope. If the token is missing or expired this
# job fails, but the website also polls npm daily, so the sync is at most a
# day late.
name: Notify website of release

on:
  release:
    types: [published]

permissions: {}

jobs:
  dispatch:
    name: Trigger docs sync on ParthJadhav/me
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not set — see the comment at the top of this workflow" >&2
            exit 1
          fi
          gh api "repos/ParthJadhav/me/dispatches" \
            -f event_type=ragelayer-release \
            -f "client_payload[version]=$VERSION"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build (tsdown)
        run: bun run build

      - name: Package correctness (publint + arethetypeswrong)
        run: bun run check:package

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Chrome runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Benchmark smoke (short run)
        env:
          DD_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run build && node scripts/benchmark.mjs --scenarios idle,mixed --duration 1500 --warmup 400

      - name: Memory leak gate
        env:
          DD_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/benchmark.mjs --scenarios idle --duration 250 --warmup 100 --leak-cycles 20

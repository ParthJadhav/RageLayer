name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA rather than a moving tag: a
# compromised or retagged release would otherwise run with this workflow's
# permissions. The trailing comment records which version each SHA is, so
# Dependabot can keep both in step.
jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run audit

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage floors
        run: bun run test:coverage

      - name: Build (tsdown)
        run: bun run build

      - name: Consumer type tests (bundler + Node 16 resolution)
        run: bun run typecheck:consumers

      - name: Package correctness (publint + arethetypeswrong)
        run: bun run check:package

      - name: Documentation site
        run: bun run docs:build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  # `engines` promises Node 20; the consumer type tests and the packaged build
  # are what a Node-based toolchain actually touches, so they run on every
  # supported major rather than only on the newest.
  node-support:
    name: Node ${{ matrix.node }} consumer build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      # The published artifact is built once by the release toolchain; what a
      # Node 20/22/24 consumer touches is the result, not the bundler. tsdown
      # itself needs Node 22+, so rebuilding per-major would test nothing real.
      - name: Download dist from the verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Consumer type tests
        run: bun run typecheck:consumers

      - name: Package correctness
        run: bun run check:package
        env:
          # attw --pack runs `npm pack`, whose prepack hook would rebuild with
          # tsdown — the downloaded dist is the artifact under test here.
          npm_config_ignore_scripts: "true"

      - name: Import the built package from Node
        # Importing on a server must not touch the DOM; this is the SSR
        # contract every framework adapter depends on.
        run: |
          node --input-type=module -e "
            const dd = await import('./dist/index.js');
            const controller = dd.createRageLayer();
            if (controller.isOpen) throw new Error('controller opened during import');
            if (dd.baseTools.length === 0) throw new Error('no tools exported');
            console.log('imported', dd.defaultTools.length, 'default tools on Node ' + process.version);
          "

  framework-examples:
    name: ${{ matrix.example }} example build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        example: [nextjs, nuxt, sveltekit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download dist from the verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Pack the reviewed checkout
        id: package
        run: |
          filename="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json | jq -r '.[0].filename')"
          echo "path=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"

      - name: Install example dependencies from lockfile
        working-directory: examples/${{ matrix.example }}
        run: bun install --frozen-lockfile

      - name: Replace the registry package with the reviewed artifact
        working-directory: examples/${{ matrix.example }}
        run: |
          npm install --no-save --package-lock=false --audit=false --fund=false "${{ steps.package.outputs.path }}"
          cmp node_modules/ragelayer/dist/index.js ../../dist/index.js

      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: bun run build

  browser:
    name: Chrome runtime suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Build
        run: bun run build

      - name: Runtime behaviour suite
        # The only place page capture, the WebGL2 surface shader and the
        # post-processing chain are executed for real.
        env:
          RAGELAYER_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/browser-test.mjs

      - name: Benchmark smoke (short run)
        env:
          RAGELAYER_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/benchmark.mjs --scenarios idle,mixed --duration 1500 --warmup 400 --assert

      - name: Memory leak gate
        env:
          RAGELAYER_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/benchmark.mjs --scenarios idle --duration 250 --warmup 100 --leak-cycles 20

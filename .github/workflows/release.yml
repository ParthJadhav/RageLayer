name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # This runtime includes npm 11.17.0, which supports trusted
          # publishing without downloading another executable at release time.
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # v2 renamed every one of these; the old names fail the run outright
          # rather than being ignored, so they move together with the SHA.
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download published registry artifact
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(jq -r .version package.json)"
          for attempt in {1..6}; do
            if npm pack "ragelayer@${version}" --ignore-scripts; then
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "ragelayer@${version} did not become available from the registry in time" >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Attach tarball to GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          gh release upload "v${version}" ragelayer-*.tgz --clobber

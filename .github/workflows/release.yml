name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. npm exchanges the
      # job's `id-token` for a short-lived publishing credential; no long-lived
      # npm token is stored in GitHub. See docs/releasing.md.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download published registry artifact
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(jq -r .version package.json)"
          for attempt in {1..6}; do
            if npm pack "ragelayer@${version}" --ignore-scripts; then
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "ragelayer@${version} did not become available from the registry in time" >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Attach tarball to GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          gh release upload "v${version}" ragelayer-*.tgz --clobber

<!doctype html>
<meta charset="utf-8" />
<title>desktop-destroyer debris orientation harness</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 12px ui-monospace, monospace; padding: 10px; }
  canvas { border: 1px solid #444; margin-right: 10px; vertical-align: top; }
  pre { white-space: pre-wrap; }
</style>
<div id="stage"></div>
<pre id="out">running…</pre>
<script type="module">
  import { bakeChunk, makeChunk, PhysicsWorld } from "./dist/index.js";

  const W = 400;
  const H = 300;
  const DPR = 2;

  // The chunk we will cut out, and four unmistakable corner markers inside it.
  // Any flip — horizontal, vertical, or both — permutes these four colours.
  const RECT = { x0: 100, y0: 80, x1: 200, y1: 160 };
  const CORNERS = [
    ["TL", "#ff0000", RECT.x0, RECT.y0],
    ["TR", "#00ff00", RECT.x1 - 20, RECT.y0],
    ["BL", "#0000ff", RECT.x0, RECT.y1 - 20],
    ["BR", "#ffff00", RECT.x1 - 20, RECT.y1 - 20],
  ];

  function makeRaster() {
    const c = document.createElement("canvas");
    c.width = W * DPR;
    c.height = H * DPR;
    const x = c.getContext("2d");
    x.scale(DPR, DPR);
    x.fillStyle = "#202830";
    x.fillRect(0, 0, W, H);
    for (const [, colour, cx, cy] of CORNERS) {
      x.fillStyle = colour;
      x.fillRect(cx, cy, 20, 20);
    }
    return c;
  }

  const results = [];
  const check = (name, pass, detail) => results.push({ name, pass, detail });

  const raster = makeRaster();
  const source = { img: raster, dpr: DPR, width: W, height: H };
  const stage = document.getElementById("stage");
  stage.appendChild(raster);

  const poly = [RECT.x0, RECT.y0, RECT.x1, RECT.y0, RECT.x1, RECT.y1, RECT.x0, RECT.y1];

  const pick = (data, w, x, y) => {
    const i = (Math.round(y) * w + Math.round(x)) * 4;
    return `${data[i]},${data[i + 1]},${data[i + 2]}`;
  };
  const rgb = (hex) =>
    `${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)}`;

  // ── 1. bakeChunk: does the sprite carry the page the right way up? ─────────
  const baked = bakeChunk(source, poly, {});
  stage.appendChild(baked.sprite);
  const sd = baked.sprite.getContext("2d").getImageData(0, 0, baked.sprite.width, baked.sprite.height).data;
  const sw = baked.sprite.width;

  const bakedCorners = CORNERS.map(([name, colour, cx, cy]) => {
    // Centre of that marker, in sprite-local CSS px, then device px.
    const lx = (cx + 10 - RECT.x0) * DPR;
    const ly = (cy + 10 - RECT.y0) * DPR;
    return { name, want: rgb(colour), got: pick(sd, sw, lx, ly) };
  });
  const bakedOk = bakedCorners.filter((c) => c.want === c.got).length;
  check(
    "bakeChunk sprite is not flipped",
    bakedOk === 4,
    bakedCorners.map((c) => `${c.name} want ${c.want} got ${c.got}`).join(" | "),
  );

  // ── 2. The render path: body at angle 0 must land back where it was cut ────
  const body = makeChunk(source, poly, { ttl: 999 }, {});
  const world = new PhysicsWorld({ gravity: 0 });
  world.add(body);
  body.vx = body.vy = body.av = 0;
  body.angle = 0;

  const out = document.createElement("canvas");
  out.width = W * DPR;
  out.height = H * DPR;
  const octx = out.getContext("2d");
  octx.scale(DPR, DPR);
  world.render(octx, 0, 0, W, H);
  stage.appendChild(out);
  const od = octx.getImageData(0, 0, out.width, out.height).data;

  const drawnCorners = CORNERS.map(([name, colour, cx, cy]) => ({
    name,
    want: rgb(colour),
    got: pick(od, out.width, (cx + 10) * DPR, (cy + 10) * DPR),
  }));
  const drawnOk = drawnCorners.filter((c) => c.want === c.got).length;
  check(
    "body at angle 0 draws back in place, unflipped",
    drawnOk === 4,
    drawnCorners.map((c) => `${c.name} want ${c.want} got ${c.got}`).join(" | "),
  );

  // ── 3. Diagnose which axis, if either, got flipped ─────────────────────────
  if (drawnOk !== 4) {
    const got = Object.fromEntries(drawnCorners.map((c) => [c.name, c.got]));
    const want = Object.fromEntries(CORNERS.map(([n, c]) => [n, rgb(c)]));
    const hFlip = got.TL === want.TR && got.TR === want.TL;
    const vFlip = got.TL === want.BL && got.BL === want.TL;
    const both = got.TL === want.BR && got.BR === want.TL;
    check(
      "flip axis",
      false,
      both ? "180° (both axes)" : hFlip ? "horizontal" : vFlip ? "vertical" : "not a clean flip — offset?",
    );
  }

  check(
    "body centroid matches the rect centre",
    Math.abs(body.x - (RECT.x0 + RECT.x1) / 2) < 0.5 && Math.abs(body.y - (RECT.y0 + RECT.y1) / 2) < 0.5,
    `centroid=(${body.x.toFixed(1)}, ${body.y.toFixed(1)}) want=(150.0, 120.0)`,
  );
  check(
    "sprite offset is zero for a symmetric chunk",
    Math.abs(body.spriteX) < 0.5 && Math.abs(body.spriteY) < 0.5,
    `spriteX=${body.spriteX.toFixed(2)} spriteY=${body.spriteY.toFixed(2)}`,
  );
  check(
    "default bake carries a slab-side sprite",
    body.sideSprite instanceof HTMLCanvasElement,
    `sideSprite=${body.sideSprite ? body.sideSprite.width + "x" + body.sideSprite.height : "null"}`,
  );

  // ── 4. An irregular cell, where centroid ≠ AABB centre ────────────────────
  //
  // The symmetric rect above has a zero sprite offset, so it cannot catch a
  // sign error in `spriteX = cx - body.x`. A wedge can: get that sign wrong and
  // the art lands mirrored about the centroid, which is what "the debris carries
  // flipped art" would look like. Tested at a rotation too, since the offset is
  // applied in the body's rotated frame.
  for (const [label, angle] of [["angle 0", 0], ["rotated 0.7rad", 0.7]]) {
    // Deliberately lopsided so the AABB centre and the centroid differ — that
    // gap is the whole point of the test.
    const wedge = [104, 84, 196, 84, 196, 156, 134, 158];
    // `flat` skips the slab-side sprite: this test is about sprite orientation,
    // and the side's deliberate 3px protrusion would read as mismatched pixels.
    const wBody = makeChunk(source, wedge, { ttl: 999 }, { flat: true });
    wBody.angle = angle;
    const w2 = new PhysicsWorld({ gravity: 0 });
    w2.add(wBody);
    wBody.vx = wBody.vy = wBody.av = 0;
    wBody.angle = angle;

    const o2 = document.createElement("canvas");
    o2.width = W * DPR;
    o2.height = H * DPR;
    const c2 = o2.getContext("2d");
    c2.scale(DPR, DPR);
    w2.render(c2, 0, 0, W, H);
    stage.appendChild(o2);
    const d2 = c2.getImageData(0, 0, o2.width, o2.height).data;

    // Compare the rendered body against the source page, pixel by pixel, over
    // every point the sprite actually painted. A mirror, a flip, or a sign error
    // in the offset all show up as a wall of mismatches; sub-pixel resampling at
    // a rotation shows up as a thin edge fringe, which the tolerance absorbs.
    const rd = raster.getContext("2d").getImageData(0, 0, raster.width, raster.height).data;
    const ca = Math.cos(angle);
    const sa = Math.sin(angle);
    let compared = 0;
    let wrong = 0;
    for (let py = 70 * DPR; py < 175 * DPR; py++) {
      for (let px = 90 * DPR; px < 215 * DPR; px++) {
        const i = (py * o2.width + px) * 4;
        if (d2[i + 3] < 250) continue; // edge antialiasing, or outside the shard
        // Un-rotate this device pixel about the centroid to find the page pixel
        // it was cut from.
        const dx = px / DPR - wBody.x;
        const dy = py / DPR - wBody.y;
        const sx = Math.round((wBody.x + dx * ca + dy * sa) * DPR);
        const sy = Math.round((wBody.y - dx * sa + dy * ca) * DPR);
        if (sx < 0 || sy < 0 || sx >= raster.width || sy >= raster.height) continue;
        const j = (sy * raster.width + sx) * 4;
        compared++;
        const delta =
          Math.abs(d2[i] - rd[j]) + Math.abs(d2[i + 1] - rd[j + 1]) + Math.abs(d2[i + 2] - rd[j + 2]);
        if (delta > 24) wrong++;
      }
    }
    const bad = compared ? wrong / compared : 1;
    check(
      `irregular wedge carries the right page pixels (${label})`,
      compared > 5000 && bad < 0.02,
      `${wrong}/${compared} mismatched (${(bad * 100).toFixed(1)}%), offset=(${wBody.spriteX.toFixed(1)}, ${wBody.spriteY.toFixed(1)})`,
    );
  }

  document.getElementById("out").textContent =
    results.map((r) => `${r.pass ? "PASS" : "FAIL"}  ${r.name}  — ${r.detail}`).join("\n") +
    `\n\n${results.filter((r) => r.pass).length}/${results.length} passed` +
    `\n\ncanvases: source raster | baked sprite | rendered body`;
</script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RageLayer tool gallery</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b0d10;
        color: #f7f5ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-width: 960px; min-height: 720px;
        background:
          radial-gradient(circle at 50% 44%, rgba(255,255,255,.05), transparent 42%),
          linear-gradient(145deg, #171a20, #0d0f13 62%);
      }
      body::before {
        content: ""; position: fixed; inset: 0; opacity: .18; pointer-events: none;
        background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      #evidence {
        position: fixed; inset: 0; width: 100vw; height: 100vh; margin: 0; padding: 0;
        border: 0; overflow: hidden; pointer-events: none; color: inherit; background: transparent;
      }
      #evidence::backdrop { display: none; }
      #stage {
        width: 960px; height: 720px; overflow: hidden; position: relative;
      }
      #heading {
        visibility: visible; position: fixed; top: 34px; left: 48px; z-index: 1000;
        pointer-events: none;
      }
      #eyebrow {
        color: #ffb66d; font-size: 12px; font-weight: 800; letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 { margin: 7px 0 0; font-size: 29px; letter-spacing: -.035em; }
      #subtitle { margin-top: 5px; color: #979da8; font-size: 13px; }
      #sample {
        position: absolute; left: 180px; top: 160px; width: 600px; height: 380px;
        display: grid; place-items: center; overflow: hidden;
        border: 1px solid rgba(255,245,220,.28); border-radius: 22px;
        color: #fff7e7;
        background:
          linear-gradient(92deg, transparent 0 14%, rgba(67,31,14,.2) 14.5%, transparent 15.2%),
          repeating-radial-gradient(ellipse at 18% 58%, transparent 0 25px, rgba(61,27,12,.22) 27px 29px),
          linear-gradient(145deg, #bd8247, #7a4728);
        box-shadow: 0 40px 90px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.35);
      }
      #sample::after {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .38;
        background: repeating-linear-gradient(3deg, transparent 0 18px, rgba(48,20,8,.16) 19px 20px);
      }
      #sample-copy { position: relative; z-index: 1; text-align: center; }
      #sample-name { font-size: 62px; font-weight: 850; letter-spacing: -.06em; }
      #sample-kind {
        margin-top: -4px; opacity: .65; font-size: 14px; letter-spacing: .14em;
        text-transform: uppercase;
      }
      #footer {
        visibility: visible; position: fixed; left: 48px; right: 48px; bottom: 34px;
        z-index: 1000; pointer-events: none;
        display: flex; justify-content: space-between; color: #8e949e; font-size: 12px;
      }
      #result {
        visibility: visible; position: fixed; right: 48px; top: 44px; z-index: 1000;
        color: #d9dde4; font-size: 12px; font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <section id="sample">
        <div id="sample-copy">
          <div id="sample-name">Wood</div>
          <div id="sample-kind">Fixed RageLayer test surface</div>
        </div>
      </section>
    </main>
    <div id="evidence" popover="manual" data-ragelayer-ignore>
      <div id="heading">
        <div id="eyebrow">Built-in tool verification</div>
        <h1><span id="tool-label">Tool</span> on fixed wood</h1>
        <div id="subtitle">Deterministic real-Chrome scenario</div>
      </div>
      <div id="footer">
        <span>960 × 720 · isolated capture</span>
        <span>Real Chrome evidence</span>
      </div>
      <div id="result">Scenario ready</div>
    </div>
    <script type="module">
      import { defaultTools, DestroyerEngine } from "../../dist/index.js";

      const toolIds = [
        "hammer", "gun", "flamethrower", "water", "chainsaw", "paintball", "demolition",
        "rocket", "lightning", "blackhole", "bugs", "gravity-gun", "laser-cutter",
        "acid-sprayer", "sticky-bombs", "broom",
      ];
      const actualToolIds = defaultTools.map((tool) => tool.id);
      if (
        actualToolIds.length !== toolIds.length ||
        toolIds.some((toolId) => !actualToolIds.includes(toolId))
      ) {
        throw new Error(`Unexpected built-in tools: ${actualToolIds.join(", ")}`);
      }

      const params = new URLSearchParams(location.search);
      const toolId = params.get("tool") ?? "hammer";
      const postFX = params.get("postfx") !== "off";
      const tool = defaultTools.find((candidate) => candidate.id === toolId);
      if (!tool) throw new Error(`Unknown tool: ${toolId}`);

      let seed = 2166136261;
      for (const character of toolId) {
        seed ^= character.charCodeAt(0);
        seed = Math.imul(seed, 16777619);
      }
      Math.random = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let value = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value;
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };

      document.querySelector("#tool-label").textContent = tool.name;
      document.querySelector("#evidence").showPopover();

      const engine = new DestroyerEngine({
        contentRoot: document.querySelector("#stage"),
        zIndex: 100,
        history: false,
        soundEnabled: false,
        pauseWhenHidden: false,
        quality: "high",
        postFX,
      });
      engine.registerTools(defaultTools);
      window.engine = engine;
      window.__toolGalleryFixture = { engine, tool, toolIds };
      document.documentElement.dataset.ready = "true";
    </script>
  </body>
</html>
